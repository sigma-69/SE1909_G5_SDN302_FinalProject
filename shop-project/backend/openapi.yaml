                        description: ID sản phẩm
                      quantity:
                        type: number
                        description: Số lượng
                      variant:
                        type: string
                        description: ID biến thể, nếu sản phẩm có phân loại
                  description: Bỏ trống để lấy giỏ hàng hiện tại
                shippingPrice:
                  type: number
                  description: Phí vận chuyển, mặc định 30000
              required:
                - shippingAddress

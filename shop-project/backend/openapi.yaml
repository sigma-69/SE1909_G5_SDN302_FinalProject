components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT trả về từ đăng nhập hoặc đăng ký. Gửi header Authorization:
        Bearer <token>."
    adminCookie:
      type: apiKey
      in: cookie
      name: admin_token
      description: Cookie httpOnly tạo khi admin đăng nhập, dùng cho các trang EJS /admin.
  schemas:
    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      example:
        success: false
        message: Dữ liệu không hợp lệ
    Address:
      type: object
      properties:
        _id:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        phone:
          type: string
        isDefault:
          type: boolean
      example:
        _id: 665f1a2b3c4d5e6f7a8b9c0a
        street: 123 Nguyễn Văn Cừ
        city: Phường An Khánh
        state: Ninh Kiều, Cần Thơ
        phone: "0912345678"
        isDefault: true
    AddressList:
      type: array
      items:
        $ref: "#/components/schemas/Address"
    User:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - customer
            - staff
            - admin
        isActive:
          type: boolean
        avatar:
          type: string
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        _id: 665f1a2b3c4d5e6f7a8b9c01
        name: Nguyễn Văn A
        email: newuser@shop.com
        role: customer
        isActive: true
        avatar: ""
        addresses: []
    UserProfile:
      $ref: "#/components/schemas/User"
    UserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            token:
              type: string
              description: JWT dùng cho nút Authorize
            voucher:
              $ref: "#/components/schemas/Coupon"
    ProductVariant:
      type: object
      properties:
        _id:
          type: string
        sku:
          type: string
        size:
          type: string
        color:
          type: string
        price:
          type: number
          nullable: true
        stock:
          type: integer
        isActive:
          type: boolean
    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        price:

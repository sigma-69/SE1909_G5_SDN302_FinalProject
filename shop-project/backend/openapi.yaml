openapi: 3.0.3
info:
  title: CLOSET STUDIO API
  version: 1.0.0
  description: >-
    Dự án SE1909_G5_SDN302_FinalProject (CLOSET STUDIO) là website thương mại
    điện tử bán quần áo, phục vụ bài tập lớn môn SDN302. Khách hàng xem danh
    mục, tìm kiếm, lọc, sắp xếp, quản lý giỏ hàng và danh sách yêu thích, đặt
    hàng, đánh giá và bình luận. Nhân viên và quản trị viên quản lý sản phẩm,
    phân loại, đơn hàng, mã giảm giá, người dùng và thống kê.


    Công nghệ sử dụng:


    - Backend: Node.js và Express 5.

    - Cơ sở dữ liệu: MongoDB với Mongoose.

    - Frontend: React 19, Vite, React Router 7, Axios, react-hot-toast,
    lucide-react và Chart.js.

    - Xác thực: JWT (jsonwebtoken) qua header Authorization Bearer; mật khẩu
    được băm bằng bcryptjs trong hook pre-save của model User; phân quyền bằng
    middleware protect, isAdmin và isStaffOrAdmin. Dashboard quản trị render
    bằng EJS dùng cookie httpOnly admin_token.

    - Thư viện và dịch vụ khác: Cloudinary và Multer cho ảnh sản phẩm và avatar,
    Nodemailer cho email đặt lại mật khẩu, CORS, cookie-parser, dotenv, và
    Swagger UI (OpenAPI 3) tại /api-docs.


    Đối soát lại mọi router trong server.js, gồm cả router được mount hai lần và
    các trang Admin EJS, không thấy thêm cặp phương thức và đường dẫn nào ngoài
    93 endpoint. Hệ thống đăng ký đúng 93 endpoint. Mỗi endpoint là một cặp
    phương thức HTTP và đường dẫn sau khi gắn prefix. Router đánh giá được mount
    tại /api và /api/reviews, mỗi nơi 7 đường dẫn. Router bình luận được mount
    tại /api và /api/comments; 5 handler gắn tại /api trùng phương thức và đường
    dẫn với router đánh giá (Express khớp router đánh giá trước) nên không tạo
    thêm endpoint riêng trên Swagger. Phân bổ:


    - Hệ thống: 1 (GET /)

    - Giao diện Admin EJS: 7

    - Người dùng: 14 (xác thực 5, gồm quên mật khẩu và đặt lại mật khẩu; hồ sơ
    4; địa chỉ 5)

    - Yêu thích: 4

    - Đánh giá: 14

    - Bình luận: 5

    - Mã giảm giá: 6

    - Sản phẩm: 8

    - Danh mục: 5

    - Thương hiệu: 5

    - Giỏ hàng: 5

    - Wishlist: 4

    - Đơn hàng: 7

    - Quản trị người dùng: 7

    - Thống kê: 1
servers:
  - url: /
    description: Máy chủ đang mở Swagger
  - url: http://localhost:5000
    description: Máy phát triển cục bộ
tags:
  - name: Hệ thống
    description: Kiểm tra API đang chạy.
  - name: Giao diện Admin
    description: Trang HTML EJS. Dùng cookie admin_token, không dùng nút Authorize Bearer.
  - name: Xác thực
    description: Đăng ký, đăng nhập, đăng xuất và đặt lại mật khẩu.
  - name: Hồ sơ
    description: Hồ sơ, mật khẩu và ảnh đại diện của người đang đăng nhập.
  - name: Địa chỉ
    description: Sổ địa chỉ giao hàng, chỉ dành cho customer.
  - name: Yêu thích
    description: Sản phẩm yêu thích của người đang đăng nhập.
  - name: Đánh giá
    description: Đánh giá sản phẩm. Route /api/... là cùng handler được mount thêm một lần.
  - name: Mã giảm giá
    description: Xem, áp dụng và quản lý coupon.
  - name: Sản phẩm
    description: Danh mục bán hàng, tìm kiếm, lọc, sắp xếp và biến thể. Ảnh là URL,
      không phải file.
  - name: Danh mục
    description: Phân loại sản phẩm.
  - name: Thương hiệu
    description: Thương hiệu sản phẩm.
  - name: Bình luận
    description: Bình luận và trả lời của nhân viên.
  - name: Giỏ hàng
    description: Giỏ hàng của người đang đăng nhập.
  - name: Wishlist
    description: Danh sách muốn mua, có thể chuyển sang giỏ hàng.
  - name: Đơn hàng
    description: Tạo và theo dõi đơn.
  - name: Quản trị người dùng
    description: Chỉ admin. Quản lý tài khoản và tạo staff.
  - name: Thống kê
    description: Số liệu doanh thu cho staff hoặc admin.
paths:
  /:
    get:
      tags:
        - Hệ thống
      summary: Kiểm tra API đang chạy
      description: Kiểm tra API đang chạy. Không yêu cầu đăng nhập.
      operationId: get_
      security: []
      responses:
        "200":
          description: Chuỗi thông báo API đang chạy
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Lỗi hệ thống
  /admin/logout:
    post:
      tags:
        - Giao diện Admin
      summary: Đăng xuất dashboard EJS và xóa cookie admin_token
      description: Đăng xuất dashboard EJS và xóa cookie admin_token. Không yêu cầu
        đăng nhập.
      operationId: post_admin_logout
      security: []
      responses:
        "200":
          description: Chuyển hướng hoặc trang xác nhận đăng xuất
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Chuyển hướng sau khi đăng xuất
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Lỗi hệ thống
  /admin:
    get:
      tags:
        - Giao diện Admin
      summary: Chuyển tới dashboard
      description: Chuyển tới dashboard. Yêu cầu cookie httpOnly admin_token của tài
        khoản admin. Thiếu quyền thì chuyển hướng về trang đăng nhập.
      operationId: get_admin
      security:
        - adminCookie: []
      responses:
        "302":
          description: Chuyển về trang đăng nhập khi thiếu cookie, token hết hạn hoặc
            không phải admin
  /admin/dashboard:
    get:
      tags:
        - Giao diện Admin
      summary: Trang tổng quan EJS
      description: Trang tổng quan EJS. Yêu cầu cookie httpOnly admin_token của tài
        khoản admin. Thiếu quyền thì chuyển hướng về trang đăng nhập.
      operationId: get_admin_dashboard
      security:
        - adminCookie: []
      responses:
        "200":
          description: HTML dashboard
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Chuyển về trang đăng nhập khi thiếu cookie, token hết hạn hoặc
            không phải admin
  /admin/users:
    get:
      tags:
        - Giao diện Admin
      summary: Trang quản lý người dùng EJS
      description: Trang quản lý người dùng EJS. Yêu cầu cookie httpOnly admin_token
        của tài khoản admin. Thiếu quyền thì chuyển hướng về trang đăng nhập.
      operationId: get_admin_users
      security:
        - adminCookie: []
      responses:
        "200":
          description: HTML danh sách người dùng
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Chuyển về trang đăng nhập khi thiếu cookie, token hết hạn hoặc
            không phải admin
  /admin/users/{id}/role:
    post:
      tags:
        - Giao diện Admin
      summary: Đổi vai trò người dùng từ form EJS
      description: Đổi vai trò người dùng từ form EJS. Yêu cầu cookie httpOnly
        admin_token của tài khoản admin. Thiếu quyền thì chuyển hướng về trang
        đăng nhập.
      operationId: post_admin_users_id_role
      security:
        - adminCookie: []
      responses:
        "302":
          description: Chuyển về trang đăng nhập khi thiếu cookie, token hết hạn hoặc
            không phải admin
        "400":
          description: Dữ liệu gửi lên không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Dữ liệu gửi lên không hợp lệ
        "404":
          description: Không tìm thấy dữ liệu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Không tìm thấy dữ liệu
      parameters:
        - name: id
          in: path
          required: true
          description: Định danh MongoDB
          schema:
            type: string
            description: Định danh MongoDB
          example: 665f1a2b3c4d5e6f7a8b9c0d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  description: customer, staff hoặc admin
                  enum:
                    - customer
                    - staff
                    - admin
              required:
                - role
            example:
              role: customer
  /admin/users/{id}/delete:
    post:
      tags:
        - Giao diện Admin
      summary: Xóa người dùng từ form EJS
      description: Xóa người dùng từ form EJS. Yêu cầu cookie httpOnly admin_token của
        tài khoản admin. Thiếu quyền thì chuyển hướng về trang đăng nhập.
      operationId: post_admin_users_id_delete
      security:
        - adminCookie: []
      responses:
        "302":
          description: Chuyển về trang đăng nhập khi thiếu cookie, token hết hạn hoặc
            không phải admin
        "404":
          description: Không tìm thấy dữ liệu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Không tìm thấy dữ liệu
      parameters:
        - name: id
          in: path
          required: true
          description: Định danh MongoDB
          schema:
            type: string
            description: Định danh MongoDB
          example: 665f1a2b3c4d5e6f7a8b9c0d
  /admin/coupons:
    get:
      tags:
        - Giao diện Admin
      summary: Trang mã giảm giá EJS
      description: Trang mã giảm giá EJS. Yêu cầu cookie httpOnly admin_token của tài
        khoản admin. Thiếu quyền thì chuyển hướng về trang đăng nhập.
      operationId: get_admin_coupons
      security:
        - adminCookie: []
      responses:
        "200":
          description: HTML mã giảm giá
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Chuyển về trang đăng nhập khi thiếu cookie, token hết hạn hoặc
            không phải admin
  /api/users/register:
    post:
      tags:
        - Xác thực
      summary: Đăng ký tài khoản customer
      description: Đăng ký tài khoản customer. Không yêu cầu đăng nhập.
      operationId: post_api_users_register
      security: []
      responses:
        "201":
          description: Tạo tài khoản và trả JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Thiếu trường hoặc dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Thiếu trường hoặc dữ liệu không hợp lệ
        "409":
          description: Email đã được dùng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Email đã được dùng
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Lỗi hệ thống
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Họ tên, 2 đến 100 ký tự
                email:
                  type: string
                  description: Email
                password:
                  type: string
                  description: Mật khẩu, tối thiểu 6 ký tự
              required:
                - name
                - email
                - password
            example:
              name: Nguyễn Văn A
              email: newuser@shop.com
              password: password123
  /api/users/login:
    post:
      tags:
        - Xác thực
      summary: Đăng nhập và nhận JWT
      description: Đăng nhập và nhận JWT. Không yêu cầu đăng nhập.
      operationId: post_api_users_login
      security: []
      responses:
        "200":
          description: Đăng nhập thành công. Admin còn nhận cookie admin_token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Thiếu email hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Thiếu email hoặc mật khẩu
        "401":
          description: Email hoặc mật khẩu không đúng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Email hoặc mật khẩu không đúng
        "403":
          description: Tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Tài khoản bị khóa
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Lỗi hệ thống
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email
                password:
                  type: string
                  description: Mật khẩu
              required:
                - email
                - password
            example:
              email: newuser@shop.com
              password: password123
  /api/users/logout:
    post:
      tags:
        - Xác thực
      summary: Đăng xuất và xóa cookie admin_token
      description: Đăng xuất và xóa cookie admin_token. Không yêu cầu đăng nhập.
      operationId: post_api_users_logout
      security: []
      responses:
        "200":
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Đăng xuất thành công
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Lỗi hệ thống
  /api/users/forgot-password:
    post:
      tags:
        - Xác thực
      summary: Gửi email đặt lại mật khẩu
      description: Gửi email đặt lại mật khẩu. Không yêu cầu đăng nhập.
      operationId: post_api_users_forgot-password
      security: []
      responses:
        "200":
          description: Luôn cùng một thông báo, không tiết lộ email có tồn tại hay không
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Luôn cùng một thông báo, không tiết lộ email có tồn tại hay không
        "400":
          description: Email không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Email không hợp lệ
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Lỗi hệ thống
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email tài khoản
              required:
                - email
            example:
              email: newuser@shop.com
  /api/users/reset-password/{token}:
    post:
      tags:
        - Xác thực
      summary: Đặt mật khẩu mới bằng token một lần
      description: Đặt mật khẩu mới bằng token một lần. Không yêu cầu đăng nhập.
      operationId: post_api_users_reset-password_token
      security: []
      responses:
        "200":
          description: Đổi mật khẩu thành công và hủy token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Đổi mật khẩu thành công và hủy token
        "400":
          description: Token không hợp lệ, hết hạn, đã dùng, hoặc mật khẩu quá ngắn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Token không hợp lệ, hết hạn, đã dùng, hoặc mật khẩu quá ngắn
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Lỗi hệ thống
      parameters:
        - name: token
          in: path
          required: true
          description: Token đặt lại mật khẩu, 64 ký tự hex
          schema:
            type: string
            description: Token đặt lại mật khẩu, 64 ký tự hex
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Mật khẩu mới, tối thiểu 6 ký tự
              required:
                - password
            example:
              password: password123
  /api/users/profile:
    get:
      tags:
        - Hồ sơ
      summary: Lấy hồ sơ người dùng hiện tại
      description: Lấy hồ sơ người dùng hiện tại. Yêu cầu Bearer JWT.
      operationId: get_api_users_profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Hồ sơ, không gồm mật khẩu và token đặt lại mật khẩu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Thiếu token, token hết hạn hoặc mật khẩu đã đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Thiếu token, token hết hạn hoặc mật khẩu đã đổi
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Lỗi hệ thống
    put:
      tags:
        - Hồ sơ
      summary: Cập nhật họ tên
      description: Cập nhật họ tên. Yêu cầu Bearer JWT.
      operationId: put_api_users_profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Hồ sơ đã cập nhật và JWT mới
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Họ tên không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Họ tên không hợp lệ
        "401":
          description: Thiếu token, token hết hạn hoặc mật khẩu đã đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Thiếu token, token hết hạn hoặc mật khẩu đã đổi
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: false
                message: Lỗi hệ thống
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Họ tên mới, 2 đến 100 ký tự
              required:
                - name
            example:
              name: Nguyễn Văn A
  /api/users/change-password:
    put:
